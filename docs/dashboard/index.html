<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIRMSGeoTools Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0b1118;--p:#111a24;--p2:#162232;--ln:#24354a;--tx:#e8eef7;--mu:#90a4bb;--ok:#4fd18b;--wa:#f6c453;--bad:#ff6b6b}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:1000;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 18px;background:#0d151fee;border-bottom:1px solid var(--ln)}
h1{font-size:18px;margin:0}.sub,.muted{color:var(--mu)}.wrap{padding:16px;max-width:1800px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px}.metric{font-size:25px;font-weight:700;margin-top:6px}.ok{color:var(--ok)}.warn{color:var(--wa)}.bad{color:var(--bad)}.section{margin-top:14px}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr);gap:12px}.split>*{min-width:0}#map{height:520px;border-radius:12px;border:1px solid var(--ln)}.controls{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px}input,select,button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px}.controls>*{width:100%}button{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--mu);position:sticky;top:0;background:var(--p)}.tablewrap{max-height:520px;overflow:auto}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#223248;margin:1px}.rowlink{cursor:pointer}.rowlink:hover{background:#152235}.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px}.bar{height:8px;background:#23344a;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:#5ea5ff}#detail{white-space:pre-wrap;overflow-wrap:anywhere}.top{display:flex;gap:8px;align-items:center}.notice{padding:10px;border:1px solid var(--ln);border-radius:8px;color:var(--mu)}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){header{position:static;flex-wrap:wrap}.top{width:100%;justify-content:flex-end}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.wrap{padding:10px}#map{height:460px}}
</style>
</head>
<body>
<header><div><h1 id="title">FIRMSGeoTools Dashboard</h1><div class="sub" id="stamp">Loading…</div></div><div class="top"><select id="window"><option value="24">24 h</option><option value="168">7 days</option><option value="720">30 days</option></select><button id="refresh">Refresh</button></div></header>
<div class="wrap"><div class="grid" id="metrics"></div>
<div class="section panel"><div class="controls"><input id="f_id" placeholder="Event ID"><input id="f_region" placeholder="Region"><select id="f_status"><option value="">Any status</option><option value="new">new</option><option value="confirmed">confirmed</option><option value="active">active</option><option value="inactive">inactive</option><option value="closed">closed</option></select><input id="f_frp" type="number" min="0" placeholder="FRP ≥ MW"><input id="f_source" placeholder="Source"><input id="f_coord" placeholder="lat,lon"><input id="f_radius" type="number" min="0.1" max="500" placeholder="radius km"><button id="search">Search</button><button id="reset">Reset</button></div></div>
<div class="section split"><div id="map"></div><div class="panel"><h2>Integrity & Coverage</h2><div id="quality"></div><h2>Events by region</h2><div id="regions"></div></div></div>
<div class="section split"><div class="panel"><h2>Events</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Last seen</th><th>Region</th><th>FRP</th><th>Sources</th><th>Status</th></tr></thead><tbody id="events"></tbody></table></div></div><div class="panel"><h2>Event detail</h2><div id="detail" class="muted">Select an event.</div></div></div>
<div class="section notice">Read-only dashboard. Access uses a temporary signed API link. Service-role credentials and API secrets are never sent to the browser.</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
var qs=new URLSearchParams(location.search),apiBase=qs.get("api")||"",auth="exp="+encodeURIComponent(qs.get("exp")||"")+"&sig="+encodeURIComponent(qs.get("sig")||"");
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/firewatch-dashboard$/.test(apiBase)){document.body.innerHTML="<div class='wrap'><div class='panel'><h1>Invalid Dashboard link</h1><p>The API endpoint is missing or invalid.</p></div></div>";return}
var map=L.map("map").setView([20,0],2),eventLayer=L.layerGroup().addTo(map),geoLayer=L.layerGroup().addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){var m={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};return m[c]})}
function num(v,d){var n=Number(v);return Number.isFinite(n)?n.toFixed(d==null?0:d):"—"}
async function api(action,body){var r=await fetch(apiBase+"?"+auth+"&action="+encodeURIComponent(action),{method:body?"POST":"GET",headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.text()).slice(0,400));return r.json()}
function met(label,value,sub,cls){return '<div class="card"><div class="muted">'+esc(label)+'</div><div class="metric '+(cls||"")+'">'+esc(value)+'</div><div class="sub">'+esc(sub||"")+'</div></div>'}
function drawGeo(g){geoLayer.clearLayers();var all=[];function add(fc,style){if(!fc||!Array.isArray(fc.features))return;var l=L.geoJSON(fc,{style:style}).addTo(geoLayer);try{var b=l.getBounds();if(b.isValid())all.push(b)}catch(e){}}add(g&&g.aoi,{color:"#5ea5ff",weight:3,fillOpacity:.04});add(g&&g.regions,{color:"#7f93aa",weight:1,fillOpacity:0});if(all.length){var b=all[0];for(var i=1;i<all.length;i++)b.extend(all[i]);map.fitBounds(b.pad(.05))}}
function renderMetrics(a,i){var e=a.events||{},c=i.source_coverage||{},n=i.notification_integrity||{},g=i.geo_integrity||{},gap=Number(n.notification_gaps||0),miss=Number(g.missing_in_db||0),deg=Number(c.sources_degraded||0);document.getElementById("metrics").innerHTML=met("New events",e.new||0,(e.touched||0)+" touched")+met("Sources",Number(c.sources_active||0)+"/"+Number(c.sources_total||0),"degraded "+deg,deg?"warn":"ok")+met("Notification integrity",gap+" gaps",Number(n.delivery_backlog||0)+" backlog",gap?"bad":Number(n.delivery_backlog||0)?"warn":"ok")+met("Geo integrity",miss+" missing","API "+Number(g.api_recent||0)+" → AOI "+Number(g.inside_aoi||0)+" → DB "+Number(g.db_matched||0),miss?"bad":"ok")}
function quality(i){var c=i.source_coverage||{},b=i.source_baseline||{},n=i.notification_integrity||{},g=i.geo_integrity||{};document.getElementById("quality").innerHTML='<div class="kv"><span>Coverage</span><b>'+esc(c.status||"—")+'</b><span>Baseline</span><b>'+esc(b.status||"—")+'</b><span>Gaps / backlog</span><b>'+Number(n.notification_gaps||0)+' / '+Number(n.delivery_backlog||0)+'</b><span>Geo missing</span><b>'+Number(g.missing_in_db||0)+'</b><span>Inside without region</span><b>'+Number(g.inside_without_region||0)+'</b></div>'}
function regions(a){var r=a.by_region||[],m=Math.max(1,...r.map(function(x){return Number(x.events||0)}));document.getElementById("regions").innerHTML=r.map(function(x){var p=Math.round(Number(x.events||0)/m*100);return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>'+esc(x.region)+'</span><b>'+Number(x.events||0)+'</b></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join("")||'<span class="muted">No regions configured.</span>'}
function color(e){if(e.lifecycle_status==="closed")return "#8aa0b8";if(Number(e.max_frp_mw||0)>=100)return "#ff6b6b";if(Number(e.max_frp_mw||0)>=30)return "#f6c453";return "#4fd18b"}
function renderEvents(rows){eventLayer.clearLayers();rows=rows||[];document.getElementById("events").innerHTML=rows.map(function(e){return '<tr class="rowlink" data-id="'+esc(e.id)+'"><td><b>'+esc(String(e.id).slice(0,8))+'</b></td><td>'+esc(String(e.last_seen||"").slice(0,16).replace("T"," "))+'</td><td>'+esc(e.region||"—")+'</td><td>'+num(e.max_frp_mw,1)+'</td><td>'+((e.sources||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join(""))+'</td><td>'+esc(e.lifecycle_status||e.status||"—")+'</td></tr>'}).join("");rows.forEach(function(e){var la=Number(e.latitude),lo=Number(e.longitude);if(!Number.isFinite(la)||!Number.isFinite(lo))return;var m=L.circleMarker([la,lo],{radius:7,color:color(e),weight:2,fillOpacity:.65}).addTo(eventLayer);m.bindTooltip("#"+String(e.id).slice(0,8)+" · "+(e.region||"")+" · FRP "+num(e.max_frp_mw,1));m.on("click",function(){detail(e.id)})});document.querySelectorAll("tr[data-id]").forEach(function(tr){tr.onclick=function(){detail(tr.getAttribute("data-id"))}})}
async function detail(id){var el=document.getElementById("detail");el.textContent="Loading…";try{var d=await api("detail",{id:id}),e=d.event||{};el.textContent=["ID: "+String(e.id||id),"Region: "+(e.region||"Unassigned"),"Status: "+(e.lifecycle_status||e.status||"—"),"First seen: "+(e.first_seen||"—"),"Last seen: "+(e.last_seen||"—"),"Coordinates: "+num(e.latitude,5)+", "+num(e.longitude,5),"Resolution: "+(e.resolution_m==null?"—":e.resolution_m+" m"),"Observations: "+Number(e.observation_count||0),"Platforms: "+Number(e.multisource_count||0),"Sources: "+((e.sources||[]).join(", ")||"—"),"FRP max / avg: "+num(e.max_frp_mw,1)+" / "+num(e.avg_frp_mw,1)+" MW","Telegram: "+(e.telegram_sent?"sent":"not sent")].join("\n")}catch(x){el.textContent="Error: "+x.message}}
async function load(){try{var h=Number(document.getElementById("window").value||24),d=await api("bootstrap",{hours:h});document.getElementById("title").textContent=(d.project_name||"FIRMSGeoTools")+" Dashboard";drawGeo(d.geography||{});renderMetrics(d.analytics||{},d.integrity||{});quality(d.integrity||{});regions(d.analytics||{});renderEvents((d.search||{}).events||[]);document.getElementById("stamp").textContent="Stage 8 · updated "+new Date().toLocaleString()}catch(x){document.getElementById("stamp").textContent="Error: "+x.message}}
async function search(){var f={limit:50},v;v=document.getElementById("f_id").value.trim();if(v)f.id=v;v=document.getElementById("f_region").value.trim();if(v)f.region=v;v=document.getElementById("f_status").value;if(v)f.status=v;v=document.getElementById("f_frp").value;if(v)f.min_frp=Number(v);v=document.getElementById("f_source").value.trim();if(v)f.source=v;v=document.getElementById("f_coord").value.trim();if(v){var a=v.split(",").map(Number);if(Number.isFinite(a[0])&&Number.isFinite(a[1])){f.lat=a[0];f.lon=a[1]}}v=document.getElementById("f_radius").value;if(v)f.radius_km=Number(v);try{renderEvents((await api("search",{filters:f})).events||[])}catch(x){alert("Search: "+x.message)}}
document.getElementById("refresh").onclick=load;document.getElementById("window").onchange=load;document.getElementById("search").onclick=search;document.getElementById("reset").onclick=function(){["f_id","f_region","f_frp","f_source","f_coord","f_radius"].forEach(function(id){document.getElementById(id).value=""});document.getElementById("f_status").value="";load()};load();setInterval(load,60000);
})();
</script></body></html>
